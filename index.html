<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Extensions by Bunny</title>
	<style>
		:root {
			--bg: #f7f7fb;
			--card: #ffffff;
			--text: #1f2330;
			--muted: #666c80;
			--accent: #0f766e;
			--border: #e5e7ef;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			color: var(--text);
			background: radial-gradient(circle at top left, #eefcf8, var(--bg) 45%);
			display: grid;
			place-items: center;
			padding: 24px;
		}

		.card {
			width: min(700px, 100%);
			background: var(--card);
			border: 1px solid var(--border);
			border-radius: 14px;
			padding: 28px;
			box-shadow: 0 12px 30px rgba(31, 35, 48, 0.08);
		}

		h1 {
			margin: 0 0 10px;
			font-size: clamp(1.6rem, 3.5vw, 2.1rem);
		}

		p {
			margin: 0 0 18px;
			color: var(--muted);
			line-height: 1.55;
		}

		nav {
			display: grid;
			gap: 10px;
		}

		a {
			color: var(--accent);
			text-decoration: none;
			font-weight: 600;
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 12px 14px;
			background: #fbfffe;
			transition: background-color 0.15s ease;
		}

		a:hover {
			background: #f0fdf9;
		}
	</style>
</head>
<body>
	<main class="card">
		<h1>Extensions by Bunny</h1>
		<p>
			Your page was loading blank because the file was empty. This starter layout confirms HTML is rendering correctly.
		</p>
		<nav aria-label="Project links">
			<a href="./Privicy%20policy/">Privacy policy folder</a>
			<a href="./Road%20Maps/">Road maps folder</a>
			<a href="./Updates/">Updates folder</a>
		</nav>
	</main>
</body>
</html>
