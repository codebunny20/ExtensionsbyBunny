<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Welcome to Reading Ruler</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		:root {
			--rr-blue: #55cdfc;
			--rr-pink: #f7a8b8;
			--rr-white: #ffffff;
			--rr-ink: #1f2340;
			--rr-muted: #324266;
			--rr-soft: #f3f6ff;
			--rr-card: #ffffff;
			--rr-line: #cfd5ff;
		}
		body {
			font-family: Arial, sans-serif;
			background: linear-gradient(180deg, var(--rr-blue) 0%, var(--rr-white) 50%, var(--rr-pink) 100%);
			color: var(--rr-ink);
			margin: 0;
			padding: 0;
			line-height: 1.6;
		}
		header {
			padding: 40px 20px;
			text-align: center;
			background: rgba(255, 255, 255, 0.72);
			border-bottom: 1px solid var(--rr-line);
		}
		h1 { margin-bottom: 10px; }
		section {
			padding: 30px 20px;
			max-width: 800px;
			margin: auto;
			background: rgba(255, 255, 255, 0.5);
			border-bottom: 1px solid var(--rr-line);
		}
		.status {
			text-align: center;
		}
		.status h2 {
			margin-top: 0;
			font-size: 2rem;
		}
		.status p {
			color: var(--rr-muted);
			margin-bottom: 0;
		}
	</style>

</head>
<body>

	<header>
		<h1>Welcome to Reading Ruler</h1>
		<p>Your focus-friendly reading companion is on the way.</p>
	</header>

	<section class="status">
		<h2>Page in Proggress</h2>
		<p>This landing page is currently being built. Please check back soon.</p>
	</section>

</body>
</html>
