<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Bunny Book</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bb-blue: #55cdfc;
            --bb-pink: #f7a8b8;
            --bb-white: #ffffff;
            --bb-ink: #1f2340;
            --bb-muted: #324266;
            --bb-soft: #f3f6ff;
            --bb-card: #ffffff;
            --bb-line: #cfd5ff;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, var(--bb-blue) 0%, var(--bb-white) 50%, var(--bb-pink) 100%);
            color: var(--bb-ink);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            padding: 40px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.72);
            border-bottom: 1px solid var(--bb-line);
        }
        h1 { margin-bottom: 10px; }
        section {
            padding: 30px 20px;
            max-width: 800px;
            margin: auto;
            background: rgba(255, 255, 255, 0.5);
            border-bottom: 1px solid var(--bb-line);
        }
        .status {
            text-align: center;
        }
        .status h2 {
            margin-top: 0;
            font-size: 2rem;
        }
        .status p {
            color: var(--bb-muted);
            margin-bottom: 0;
        }
    </style>

</head>
<body>

    <header>
        <h1>Welcome to Bunny Book</h1>
        <p>Your cozy browser companion is on the way.</p>
    </header>

    <section class="status">
        <h2>Page in Proggress</h2>
        <p>This landing page is currently being built. Please check back soon.</p>
    </section>

</body>
</html>
